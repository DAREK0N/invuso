[package]
name = "invuso-app"
description = "Invuso Dioxus app (Android)."
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
invuso-core.workspace = true
dioxus.workspace = true
dioxus-free-icons.workspace = true
rust-i18n.workspace = true
rusqlite.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
uuid.workspace = true
sys-locale.workspace = true
# Toast timer; Dioxus mobile runs inside a tokio runtime.
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Only to ask Android for the app's private files directory (platform/).
jni.workspace = true
ndk-context.workspace = true

[features]
default = ["mobile"]
# Android build (`dx serve --platform android`).
mobile = ["dioxus/mobile"]
