[package]
name = "invuso-app"
description = "Invuso Dioxus app (Android, desktop for development)."
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
invuso-core.workspace = true
dioxus.workspace = true
dioxus-free-icons.workspace = true
rust-i18n.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# Only to ask Android for the app's private files directory (platform/).
jni.workspace = true
ndk-context.workspace = true

[features]
default = ["desktop"]
# Android build (`dx serve --platform android`).
mobile = ["dioxus/mobile"]
# Local development with hot reload (`dx serve --platform desktop`).
desktop = ["dioxus/desktop"]
