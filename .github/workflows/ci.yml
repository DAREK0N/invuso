name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The `mobile` feature builds on dioxus-desktop, so host builds need the
      # WebView stack (list from the Dioxus 0.7 getting-started guide).
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # C build scripts (bundled SQLite) need the NDK compiler. Same compiler
      # and API level as `dx` 0.7 (android_min_sdk_version defaults to 28);
      # ANDROID_NDK_LATEST_HOME is preinstalled on the GitHub Ubuntu image.
      - name: Point cc at the NDK
        shell: bash
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"

      - run: cargo clippy -p invuso-app --target aarch64-linux-android -- -D warnings
