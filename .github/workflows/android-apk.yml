name: Android APK

# Builds a signed release APK for arm64-v8a (all current phones) on every
# push to main, or by hand. Download it from the run's artifacts.
#
# On main, the first build of a version (`[workspace.package] version` in
# Cargo.toml) becomes a GitHub release `v<version>` with the APK; versions
# with a suffix such as `-alpha1` are marked as pre-release. Existing
# releases are never changed: bump the version for a new one.
#
# Needs these repository secrets (the keystore never goes into the repo):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# The same key must sign every build, or Android refuses the update.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Must match the `dioxus` crate in Cargo.lock (AGENTS.md 7.1).
  DX_VERSION: 0.7.10
  DX_SHA256: 4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7

jobs:
  apk:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and its tag.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Read version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "invuso-app") | .version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Install dx
        run: |
          curl -sSfL -o dx.tar.gz \
            "https://github.com/DioxusLabs/dioxus/releases/download/v${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf dx.tar.gz -C "$HOME/.local/bin" dx
          rm dx.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # dx builds Rust in release mode but packs with Gradle's debug type,
      # signed with a throwaway debug key; it is re-signed below.
      # ANDROID_NDK_LATEST_HOME comes from the runner image, not the `env`
      # context, so it is only visible inside the shell.
      - name: Bundle
        working-directory: crates/invuso-app
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          dx bundle --platform android --release --target aarch64-linux-android \
            --package-types apk --out-dir "$GITHUB_WORKSPACE/dist"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          apk="$(ls dist/*.apk | head -1)"
          name="invuso-${VERSION}-arm64-v8a.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:STORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out "dist/$name" "$apk"
          rm "$RUNNER_TEMP/release.jks" "$apk"
          "$tools/apksigner" verify --print-certs "dist/$name"

      - uses: actions/upload-artifact@v7
        with:
          name: invuso-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists; left unchanged. Bump the version for a new release."
            exit 0
          fi
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" dist/*.apk "${flags[@]}" \
            --target "$GITHUB_SHA" --title "Invuso $VERSION" --generate-notes
