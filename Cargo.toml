[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["DAREKON"]

[workspace.dependencies]
invuso-core = { path = "crates/invuso-core" }
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
rust-i18n = "3.1.5"
rust_decimal = "1.43.0"
thiserror = "2.0.21"
iso_currency = { version = "0.7.1", features = ["iterator"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v7"] }
jni = "0.22.4"
ndk-context = "0.1.1"
sys-locale = "0.3.2"
# Same version dioxus-desktop already pulls in; its timer, `spawn_blocking`
# and the one-shot channel answering the image picker (`sync`) are used.
tokio = { version = "1.53.2", default-features = false, features = ["time", "rt", "sync"] }
# Exchange rates: blocking client with rustls (ring) and bundled Mozilla
# roots, so Android needs no platform verifier (AP-09).
ureq = "3.4.2"
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` keeps rates as their literal text, so they reach `Decimal`
# without passing through f64.
serde_json = { version = "1.0.151", features = ["raw_value"] }
# Local date, time and UTC offset of new expenses (AP-11); already in the
# tree through dioxus, `local-offset` reads the device's time zone.
time = { version = "0.3.55", features = ["local-offset"] }
# Receipt thumbnails (CORE-06); same version dioxus-desktop already pulls
# in, pure Rust decoders only.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
