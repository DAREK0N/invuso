[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1-alpha3"
edition = "2024"
authors = ["DAREKON"]

[workspace.dependencies]
invuso-core = { path = "crates/invuso-core" }
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
rust-i18n = "3.1.5"
rust_decimal = "1.43.0"
thiserror = "2.0.21"
iso_currency = { version = "0.7.1", features = ["iterator"] }
# `backup` restores a backup into the open database (DATA-02).
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1.27.0", features = ["v7"] }
jni = "0.22.4"
ndk-context = "0.1.1"
sys-locale = "0.3.2"
# Same version dioxus-desktop already pulls in; its timer, `spawn_blocking`
# and the one-shot channel answering the image picker (`sync`) are used.
tokio = { version = "1.53.2", default-features = false, features = ["time", "rt", "sync"] }
# Exchange rates: blocking client with rustls (ring) and bundled Mozilla
# roots, so Android needs no platform verifier (AP-09).
ureq = "3.4.2"
serde = { version = "1.0.229", features = ["derive"] }
# `raw_value` keeps rates as their literal text, so they reach `Decimal`
# without passing through f64.
serde_json = { version = "1.0.151", features = ["raw_value"] }
# Local date, time and UTC offset of new expenses (AP-11); already in the
# tree through dioxus, `local-offset` reads the device's time zone.
time = { version = "0.3.55", features = ["local-offset"] }
# Receipt thumbnails (CORE-06); same version dioxus-desktop already pulls
# in, pure Rust decoders only.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
# On-device text recognition (OCR-01, decision 10.1): PP-OCRv6 ONNX models
# run in pure Rust; imageproc traces the detector's text regions.
rten = "0.27.0"
rten-tensor = "0.27.0"
rten-imageproc = "0.27.0"
# NFKC for the translation tokenizer (AP-21b); already in the tree through
# url (dioxus-router), compiled Unicode data.
icu_normalizer = "2.3.0"
# SHA-256 of downloaded translation packs; the same version rustls already
# pulls in for the rate requests.
ring = "0.17.14"
# Backup archive (DATA-01): pure Rust, deflate only.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# `dx serve` builds in debug; unoptimized inference would take minutes per
# receipt, so the OCR and image crates are always optimized.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
