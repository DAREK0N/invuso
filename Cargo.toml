[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["DAREKON"]

[workspace.dependencies]
invuso-core = { path = "crates/invuso-core" }
dioxus = { version = "0.7.10", features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
rust-i18n = "3.1.5"
rust_decimal = "1.43.0"
thiserror = "2.0.21"
iso_currency = { version = "0.7.1", features = ["iterator"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.27.0", features = ["v7"] }
jni = "0.22.4"
ndk-context = "0.1.1"
sys-locale = "0.3.2"
